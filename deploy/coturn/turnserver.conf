# Template — secrets injected by entrypoint.sh / docker-compose.coturn.yml
# No TLS until certs are mounted; app should omit TURN_TLS_PORT.
listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=__TURN_REALM__
external-ip=__TURN_EXTERNAL_IP__
server-name=__TURN_REALM__
no-multicast-peers
no-cli
no-tls
no-dtls
min-port=49152
max-port=49200
verbose
