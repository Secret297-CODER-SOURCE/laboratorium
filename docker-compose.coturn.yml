# Coturn for Coolify / VPS — NOT an HTTP service (no domains / Traefik).
#
# Coolify → New Resource → Docker Compose → this file
# Environment (same TURN_SECRET as the Node app):
#   TURN_SECRET=<your secret — do not rotate unless you update the app too>
#   TURN_EXTERNAL_IP=176.37.168.47
#   TURN_REALM=turn.laboratorium.club
#
# Firewall on the VPS (ufw/security group):
#   3478/tcp  3478/udp  49152:49200/udp
#
# DNS: turn.laboratorium.club → TURN_EXTERNAL_IP (Cloudflare DNS only, grey cloud)
#
# Node app (Coolify env, Runtime — not Buildtime-only):
#   TURN_HOST=turn.laboratorium.club
#   TURN_SECRET=<same secret>
#   TURN_PUBLIC_FALLBACK=true
#   (do NOT set TURN_TLS_PORT until TLS certs are configured)

services:
  coturn:
    build:
      context: ./deploy/coturn
    image: laboratorium-coturn:local
    container_name: laboratorium-coturn
    restart: always
    # Host networking: UDP relay works reliably; ignore Coolify HTTP/domain UI.
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?Set public server IP}
      TURN_REALM: ${TURN_REALM:-turn.laboratorium.club}
