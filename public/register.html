<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" id="site-favicon">
  <link rel="alternate icon" type="image/png" href="/favicon.png">
  <link rel="alternate icon" href="/favicon.ico">
  <title>Реєстрація — laboratorium.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth-pages.css">
</head>
<body data-theme="flow">
  <div class="noise" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="grid-bg" aria-hidden="true"></div>

  <div class="auth-page">
    <div class="auth-topbar">
      <a href="/" class="auth-logo"><span class="logo-text">laboratorium<em>.</em></span></a>
      <span id="auth-lang-switch"></span>
    </div>
    <div class="auth-card">
      <div class="auth-header">
        <span class="section-tag">// auth.register</span>
        <h1 data-i18n="Створити акаунт">Створити акаунт</h1>
        <p data-i18n="Вкажіть ім'я та email — логін і пароль для входу ми надішлемо на пошту.">Вкажіть ім'я та email — логін і пароль для входу ми надішлемо на пошту.</p>
      </div>
      <form id="register-form" class="auth-form">
        <div id="form-error" class="form-error" hidden></div>
        <div id="form-success" class="form-note" hidden></div>
        <label>
          <span data-i18n="Ім'я">Ім'я</span>
          <input type="text" name="name" required placeholder="Іван Петренко" autocomplete="name">
        </label>
        <label>
          <span>Email</span>
          <input type="email" name="email" required placeholder="you@email.com" autocomplete="email">
        </label>
        <button type="submit" class="btn btn--primary btn--full" data-i18n="Зареєструватися">Зареєструватися</button>
      </form>
      <button class="btn btn--outline btn--full google-login" id="google-register" type="button" disabled>
        <span class="google-login-mark" aria-hidden="true">G</span>Створити акаунт через Google
      </button>
      <p class="google-login-note" id="google-register-note">Реєстрація через Google ще не налаштована на сервері.</p>
      <p class="auth-footer">
        <a href="/login.html" data-i18n="Вже є акаунт? Увійти">Вже є акаунт? Увійти</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { api, getUser, resolveLoginRedirect, initTheme, checkServerReady, validateSession } from '/auth.js';
    import { initI18n, t, renderLangSwitch, bindLangSwitch } from '/i18n.js';
    import { getAttribution } from '/marketing-attribution.js';
    import { trackEvent, withAnalyticsAttribution } from '/analytics.js';
    initTheme();
    initI18n();
    document.getElementById('auth-lang-switch').innerHTML = renderLangSwitch();
    bindLangSwitch(document);
    window.addEventListener('localechange', () => {
      document.getElementById('auth-lang-switch').innerHTML = renderLangSwitch();
      bindLangSwitch(document);
    });

    const params = new URLSearchParams(location.search);

    (async () => {
      if (await validateSession()) {
        window.location.replace(resolveLoginRedirect(params.get('next'), getUser()?.role));
        return;
      }

      checkServerReady().then(ok => {
        if (!ok) {
          const el = document.getElementById('form-error');
          el.textContent = 'Сервер не оновлений. У терміналі: lsof -ti :3000 | xargs kill -9 && cd /Users/worker/websites/laboratorium && npm start';
          el.hidden = false;
        }
      });

      const googleRegister = document.getElementById('google-register');
      const referralCode = getAttribution().referral_code;
      const next = withAnalyticsAttribution('/portal.html');
      googleRegister.dataset.destination = `/api/auth/google/start?next=${encodeURIComponent(next)}`
        + (referralCode ? `&referral_code=${encodeURIComponent(referralCode)}` : '');
      googleRegister.addEventListener('click', () => {
        if (googleRegister.dataset.destination) window.location.assign(googleRegister.dataset.destination);
      });
      api('/auth/google/status').then(({ enabled }) => {
        googleRegister.disabled = !enabled;
        document.getElementById('google-register-note').hidden = !!enabled;
      }).catch((err) => console.warn('Google sign-in availability check failed:', err));

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('form-error');
        const successEl = document.getElementById('form-success');
        const btn = e.target.querySelector('button');
        const fd = new FormData(e.target);
        errEl.hidden = true;
        successEl.hidden = true;
        btn.disabled = true;
        btn.textContent = t('Реєстрація...');
        try {
          const data = await api('/auth/register', {
            method: 'POST',
            body: JSON.stringify({
              name: fd.get('name'),
              email: fd.get('email'),
              ...getAttribution(),
            }),
          });
          trackEvent('registration');
          successEl.textContent = data.message;
          successEl.hidden = false;
          e.target.reset();
          btn.textContent = t('Зареєстровано');
        } catch (err) {
          errEl.textContent = err.message;
          errEl.hidden = false;
          btn.disabled = false;
          btn.textContent = t('Зареєструватися');
        }
      });
    })();
  </script>
  <script type="module" src="/analytics.js"></script>
</body>
</html>
