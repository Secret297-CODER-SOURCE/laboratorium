<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" id="site-favicon">
  <link rel="alternate icon" type="image/png" href="/favicon.png">
  <link rel="alternate icon" href="/favicon.ico">
  <title>Мануали — laboratorium.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/content-builder.css">
  <link rel="stylesheet" href="/icons.css">
</head>
<body data-theme="flow">
  <div class="noise" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="grid-bg" aria-hidden="true"></div>

  <header class="header" id="site-header"></header>

  <main class="dashboard">
    <div class="container">
      <div id="toast" class="toast" hidden></div>

      <section class="dash-panel dash-panel--wide" id="my-manuals-section" hidden>
        <div class="panel-header">
          <h2 data-i18n="Мої чернетки">Мої чернетки</h2>
        </div>
        <div id="my-manuals-list" class="group-content-list"></div>
      </section>

      <section class="dash-panel dash-panel--wide">
        <div class="panel-header">
          <h2 data-i18n="Мануали">Мануали</h2>
          <button type="button" class="btn btn--outline btn--sm" id="create-manual-btn">+ <span data-i18n="Створити мануал">Створити мануал</span></button>
        </div>
        <div class="manuals-search-bar">
          <label class="visually-hidden" for="manuals-search-input">Пошук мануалів</label>
          <input type="search" id="manuals-search-input" class="manuals-search-input"
            placeholder="Пошук мануалів, spy-soft і DigitalOcean…" autocomplete="off" spellcheck="false">
          <span class="manuals-search-hint" id="manuals-search-hint" hidden></span>
        </div>
        <div class="manuals-filters" id="manuals-filters" hidden></div>
        <div id="manuals-list" class="group-content-list">
          <p class="empty-state" data-i18n="Завантаження...">Завантаження...</p>
        </div>
      </section>

      <section class="dash-panel dash-panel--wide" id="spy-soft-section">
        <div class="panel-header panel-header--spy">
          <div>
            <h2 data-i18n="З spy-soft.net">З spy-soft.net</h2>
            <p class="panel-sub" id="spy-soft-sub">Мануали та гайди з зовнішнього каталогу</p>
          </div>
          <a class="btn btn--ghost btn--sm" id="spy-soft-open" href="https://spy-soft.net/" target="_blank" rel="noopener noreferrer">Відкрити сайт</a>
        </div>
        <div id="spy-soft-list" class="spy-soft-grid">
          <p class="empty-state">Завантаження…</p>
        </div>
      </section>

      <section class="dash-panel dash-panel--wide" id="digitalocean-section">
        <div class="panel-header panel-header--spy">
          <div>
            <h2>DigitalOcean Tutorials</h2>
            <p class="panel-sub" id="digitalocean-sub">Community tutorials з digitalocean.com</p>
          </div>
          <a class="btn btn--ghost btn--sm" id="digitalocean-open" href="https://www.digitalocean.com/community/tutorials" target="_blank" rel="noopener noreferrer">Відкрити сайт</a>
        </div>
        <div id="digitalocean-list" class="spy-soft-grid">
          <p class="empty-state">Завантаження…</p>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/manuals.js"></script>
</body>
</html>
