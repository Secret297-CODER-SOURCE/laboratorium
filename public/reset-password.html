<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" id="site-favicon">
  <link rel="alternate icon" type="image/png" href="/favicon.png">
  <link rel="alternate icon" href="/favicon.ico">
  <title>Новий пароль — laboratorium.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth-pages.css">
</head>
<body data-theme="flow">
  <div class="noise" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="auth-page">
    <a href="/" class="auth-logo"><span class="logo-text">laboratorium<em>.</em></span></a>
    <div class="auth-card">
      <div class="auth-header">
        <span class="section-tag">// auth.new-password</span>
        <h1>Новий пароль</h1>
        <p>Введіть новий пароль для вашого акаунта</p>
      </div>
      <form id="reset-form" class="auth-form">
        <div id="form-error" class="form-error" hidden></div>
        <label>
          <span>Новий пароль</span>
          <input type="password" name="password" required minlength="6" placeholder="мінімум 6 символів" autocomplete="new-password">
        </label>
        <label>
          <span>Підтвердження</span>
          <input type="password" name="password2" required minlength="6" placeholder="повторіть пароль" autocomplete="new-password">
        </label>
        <button type="submit" class="btn btn--primary btn--full">Зберегти пароль</button>
      </form>
    </div>
  </div>
  <script type="module">
    import { api, initTheme } from '/auth.js';
    initTheme();
    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
      document.getElementById('form-error').textContent = 'Недійсне посилання';
      document.getElementById('form-error').hidden = false;
      document.getElementById('reset-form').hidden = true;
    }
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('form-error');
      const fd = new FormData(e.target);
      if (fd.get('password') !== fd.get('password2')) {
        errEl.textContent = 'Паролі не збігаються';
        errEl.hidden = false;
        return;
      }
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      try {
        await api('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, password: fd.get('password') }),
        });
        window.location.href = '/login.html?reset=ok';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.hidden = false;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
