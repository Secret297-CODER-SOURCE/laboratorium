<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" id="site-favicon">
  <link rel="alternate icon" type="image/png" href="/favicon.png">
  <link rel="alternate icon" href="/favicon.ico">
  <title>Вхід — laboratorium.</title>
  <meta name="robots" content="noindex,follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth-pages.css">
</head>
<body data-theme="flow">
  <div class="noise" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="grid-bg" aria-hidden="true"></div>

  <div class="auth-page">
    <div class="auth-topbar">
      <a href="/" class="auth-logo"><span class="logo-text">laboratorium<em>.</em></span></a>
      <span id="auth-lang-switch"></span>
    </div>
    <div class="auth-card">
      <div class="auth-header">
        <span class="section-tag">// auth.login</span>
        <h1 data-i18n="Вхід до лабораторії">Вхід до лабораторії</h1>
        <p data-i18n="Єдиний вхід на платформу. Доступ надається після оплати.">Єдиний вхід на платформу. Доступ надається після оплати.</p>
      </div>
      <form id="login-form" class="auth-form">
        <div id="form-error" class="form-error" hidden></div>
        <div id="form-info" class="form-note" hidden></div>
        <label>
          <span data-i18n="Логін або email">Логін або email</span>
          <input type="text" name="login" required placeholder="nickname або you@email.com" autocomplete="username">
        </label>
        <label>
          <span data-i18n="Пароль">Пароль</span>
          <input type="password" name="password" required placeholder="••••••••" autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn--primary btn--full" data-i18n="Увійти">Увійти</button>
      </form>
      <button class="btn btn--outline btn--full google-login" id="google-login" type="button" aria-label="Увійти за допомогою Google" disabled>
        <span class="google-login-mark" aria-hidden="true">G</span>Продовжити з Google
      </button>
      <p class="google-login-note" id="google-login-note">Вхід через Google ще не налаштовано на сервері.</p>
      <p class="auth-footer">
        <a href="/forgot-password.html" data-i18n="Забули пароль?">Забули пароль?</a>
        ·
        <a href="/register.html" data-i18n="Немає акаунта? Зареєструватися">Немає акаунта? Зареєструватися</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { api, setSession, getUser, resolveLoginRedirect, initTheme, checkServerReady, validateSession } from '/auth.js';
    import { initI18n, t, renderLangSwitch, bindLangSwitch } from '/i18n.js';
    import { getAnalyticsAttribution, trackEvent, withAnalyticsAttribution } from '/analytics.js';
    initTheme();
    initI18n();
    document.getElementById('auth-lang-switch').innerHTML = renderLangSwitch();
    bindLangSwitch(document);
    window.addEventListener('localechange', () => {
      document.getElementById('auth-lang-switch').innerHTML = renderLangSwitch();
      bindLangSwitch(document);
    });

    const params = new URLSearchParams(location.search);

    (async () => {
      const googleCode = params.get('google_code');
      if (googleCode) {
        try {
          const callbackAttribution = getAnalyticsAttribution(
            new URL(params.get('next') || '/portal.html', location.origin).search,
          );
          const data = await api('/auth/google/complete', {
            method: 'POST',
            body: JSON.stringify({ code: googleCode }),
          });
          setSession(data.token, data.user);
          trackEvent('login', '', callbackAttribution);
          window.location.replace(resolveLoginRedirect(params.get('next') || data.next, data.user.role));
          return;
        } catch (err) {
          const el = document.getElementById('form-error');
          el.textContent = err.message;
          el.hidden = false;
        }
      }

      if (params.has('google_error')) {
        const el = document.getElementById('form-error');
        el.textContent = 'Не вдалося підтвердити вхід через Google. Спробуйте ще раз.';
        el.hidden = false;
      }

      if (await validateSession()) {
        window.location.replace(resolveLoginRedirect(params.get('next'), getUser()?.role));
        return;
      }

      const googleButton = document.getElementById('google-login');
      googleButton.addEventListener('click', () => {
        if (googleButton.dataset.destination) window.location.assign(googleButton.dataset.destination);
      });
      api('/auth/google/status').then(({ enabled }) => {
        const next = withAnalyticsAttribution(params.get('next') || '/portal.html');
        googleButton.dataset.destination = `/api/auth/google/start?next=${encodeURIComponent(next)}`;
        googleButton.disabled = !enabled;
        document.getElementById('google-login-note').hidden = !!enabled;
      }).catch((err) => {
        console.warn('Google sign-in availability check failed:', err);
      });

      checkServerReady().then(ok => {
        if (!ok) {
          const el = document.getElementById('form-error');
          el.textContent = 'Сервер не оновлений. У терміналі: lsof -ti :3000 | xargs kill -9 && cd /Users/worker/websites/laboratorium && npm start';
          el.hidden = false;
        }
      });

      if (params.get('reset') === 'ok') {
        const info = document.getElementById('form-info');
        info.textContent = t('Пароль оновлено. Увійдіть з новим паролем.');
        info.hidden = false;
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('form-error');
        const btn = e.target.querySelector('button');
        const fd = new FormData(e.target);
        errEl.hidden = true;
        btn.disabled = true;
        btn.textContent = t('Вхід...');
        try {
          const data = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ login: fd.get('login'), password: fd.get('password') }),
          });
          setSession(data.token, data.user);
          trackEvent('login');
          window.location.replace(resolveLoginRedirect(params.get('next'), data.user.role));
        } catch (err) {
          errEl.textContent = err.message;
          errEl.hidden = false;
          btn.disabled = false;
          btn.textContent = t('Увійти');
        }
      });
    })();
  </script>
  <script type="module" src="/analytics.js"></script>
</body>
</html>
