<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="icon" href="/favicon.png" type="image/png" id="site-favicon">
  <title>Вхід — laboratorium.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth-pages.css">
</head>
<body data-theme="flow">
  <div class="noise" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="grid-bg" aria-hidden="true"></div>

  <div class="auth-page">
    <div class="auth-topbar">
      <a href="/" class="auth-logo"><span class="logo-text">laboratorium<em>.</em></span></a>
      <span id="auth-lang-switch"></span>
    </div>
    <div class="auth-card">
      <div class="auth-header">
        <span class="section-tag">// auth.login</span>
        <h1 data-i18n="Вхід до лабораторії">Вхід до лабораторії</h1>
        <p data-i18n="Єдиний вхід на платформу. Доступ надається після оплати.">Єдиний вхід на платформу. Доступ надається після оплати.</p>
      </div>
      <form id="login-form" class="auth-form">
        <div id="form-error" class="form-error" hidden></div>
        <div id="form-info" class="form-note" hidden></div>
        <label>
          <span>Email</span>
          <input type="email" name="email" required placeholder="you@email.com" autocomplete="email">
        </label>
        <label>
          <span data-i18n="Пароль">Пароль</span>
          <input type="password" name="password" required placeholder="••••••••" autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn--primary btn--full" data-i18n="Увійти">Увійти</button>
      </form>
      <p class="auth-footer">
        <a href="/forgot-password.html" data-i18n="Забули пароль?">Забули пароль?</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { api, setSession, getUser, resolveLoginRedirect, initTheme, checkServerReady, validateSession } from '/auth.js';
    import { initI18n, t, renderLangSwitch, bindLangSwitch } from '/i18n.js';
    initTheme();
    initI18n();
    document.getElementById('auth-lang-switch').innerHTML = renderLangSwitch();
    bindLangSwitch(document);
    window.addEventListener('localechange', () => {
      document.getElementById('auth-lang-switch').innerHTML = renderLangSwitch();
      bindLangSwitch(document);
    });

    const params = new URLSearchParams(location.search);

    (async () => {
      if (await validateSession()) {
        window.location.replace(resolveLoginRedirect(params.get('next'), getUser()?.role));
        return;
      }

      checkServerReady().then(ok => {
        if (!ok) {
          const el = document.getElementById('form-error');
          el.textContent = 'Сервер не оновлений. У терміналі: lsof -ti :3000 | xargs kill -9 && cd /Users/worker/websites/laboratorium && npm start';
          el.hidden = false;
        }
      });

      if (params.get('reset') === 'ok') {
        const info = document.getElementById('form-info');
        info.textContent = t('Пароль оновлено. Увійдіть з новим паролем.');
        info.hidden = false;
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('form-error');
        const btn = e.target.querySelector('button');
        const fd = new FormData(e.target);
        errEl.hidden = true;
        btn.disabled = true;
        btn.textContent = t('Вхід...');
        try {
          const data = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
          });
          setSession(data.token, data.user);
          window.location.replace(resolveLoginRedirect(params.get('next'), data.user.role));
        } catch (err) {
          errEl.textContent = err.message;
          errEl.hidden = false;
          btn.disabled = false;
          btn.textContent = t('Увійти');
        }
      });
    })();
  </script>
</body>
</html>
