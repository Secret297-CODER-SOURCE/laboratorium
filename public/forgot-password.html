<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" id="site-favicon">
  <title>Скидання пароля — laboratorium.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth-pages.css">
</head>
<body data-theme="flow">
  <div class="noise" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="auth-page">
    <a href="/" class="auth-logo"><span class="logo-text">laboratorium<em>.</em></span></a>
    <div class="auth-card">
      <div class="auth-header">
        <span class="section-tag">// auth.reset</span>
        <h1>Скидання пароля</h1>
        <p>Надішлемо посилання на ваш email</p>
      </div>
      <form id="forgot-form" class="auth-form">
        <div id="form-error" class="form-error" hidden></div>
        <div id="form-success" class="form-note" hidden></div>
        <label>
          <span>Email</span>
          <input type="email" name="email" required placeholder="you@email.com" autocomplete="email">
        </label>
        <button type="submit" class="btn btn--primary btn--full">Надіслати посилання</button>
      </form>
      <p class="auth-footer"><a href="/login.html">← Назад до входу</a></p>
    </div>
  </div>
  <script type="module">
    import { api, initTheme, checkServerReady } from '/auth.js';
    initTheme();
    checkServerReady().then(ok => {
      if (!ok) {
        const el = document.getElementById('form-error');
        el.textContent = 'Сервер не оновлений. У терміналі: lsof -ti :3000 | xargs kill -9 && cd /Users/worker/websites/laboratorium && npm start';
        el.hidden = false;
      }
    });
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('form-error');
      const okEl = document.getElementById('form-success');
      const btn = e.target.querySelector('button');
      const email = new FormData(e.target).get('email');
      errEl.hidden = true; okEl.hidden = true;
      btn.disabled = true;
      try {
        const data = await api('/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
        okEl.textContent = data.message || 'Якщо email зареєстровано, лист надіслано';
        okEl.hidden = false;
        e.target.querySelector('label').hidden = true;
        btn.textContent = 'Надіслано';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.hidden = false;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
